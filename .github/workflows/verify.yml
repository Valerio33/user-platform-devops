name: Verify Java and Docker Compose
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit and integration tests
        run: mvn -B clean verify
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Start complete platform
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: End-to-end check with real Kafka, PostgreSQL and SMTP
        run: docker compose --profile test run --rm smoke-test
      - name: Save diagnostic logs
        if: always()
        run: |
          mkdir -p diagnostics
          docker compose ps -a > diagnostics/compose-ps.txt
          docker compose logs --no-color > diagnostics/compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            diagnostics/
            **/target/surefire-reports/
            **/target/failsafe-reports/
      - name: Stop containers
        if: always()
        run: docker compose down
